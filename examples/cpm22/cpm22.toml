# CompuPro CP/M 2.2K, with its console in a built-in terminal WINDOW instead of stdio.
#
#     cd examples/cpm22 && pascal100 cpm22.toml
#     -> a VT100 window opens; the CP/M banner and the A> prompt appear IN IT.
#        The monitor's pascal100> prompt stays in the terminal you launched from.
#
# THIS FILE IS THE WHOLE MACHINE. It is the same machine and the same disk as
# cpm22-console.toml. Only the console cable is different: channel A of the Interfacer 1
# connects to `terminal`, a VT100 window that the simulator draws, instead of to `console`
# (your stdio).
#
# THE EMULATION. `emulation=vt100` here (the default). `adm3a`, `vt52` and `h19` are the other
# terminals. `size` is COLSxROWS and defaults to 80x24.
#
# SDL ONLY. `terminal` needs a window, so it works only in a build with SDL and a display. A
# headless build refuses it at CONNECT and says why. Use cpm22-console.toml there.
#> CompuPro CP/M 2.2K, with its console in a VT100 window -- the window that just opened.
#> The monitor stays here on stdio: type BOARDS or SHOW MOUNTS, and RUN 0 to boot.
#> STOP (^E) pulls the keyboard back here to the monitor; RUN resumes the guest.

[machine]
name    = "cpm22"
# Boot the disk as cpm22-console.toml does. The keyboard follows the guest on RUN, so once
# CP/M is up you type into the VT100 window; ^E returns you here.
startup = ["RUN 0"]

[display]
crt   = true
focus = true

# THE CPU: a generic Z80 card, flat out (clock_hz = 0).
[[board]]
type     = "z80"
id       = "cpu0"
clock_hz = 0

# THE CONSOLE: channel A of a CompuPro Interfacer 1 at 00-01, in a VT100 window. `title` names
# the window, on your title bar and on a grey bar at the top of the screen. Channel B at 02-03
# is not connected.
[[board]]
type = "interfacer1"
id   = "if1"

  [board.unit.a]
  connect = "terminal?emulation=vt100&size=80x24&width=1100"
  title   = "CP/M 2.2K console"

# The Backspace key sends DEL; CP/M wants BS. [console] is stdio, [terminal] is the window.
[console]
bsdel = "bs"

[terminal]
bsdel = "bs"

# THE DISK 1 at C0, boot routine 4: after a reset its EPROM answers at 0000-00FF (reads only)
# and reads track 0 of drive 0 by DMA.
[[board]]
type = "disk1"
id   = "fd0"
port = C0

  [[board.drive]]
  unit  = 0
  mount = "cpm22k-64k.dsk"

# THE HOST BRIDGE at B0, for the R, W and HDIR utilities. hostdir "" = the folder you started
# pascal100 in.
[[board]]
type    = "hostbridge"
id      = "hb0"
port    = B0
hostdir = ""

# THE MEMORY: 64K of RAM in segment 00, 16-bit capable, filled at random as real static RAM is.
# It gives way to the Disk 1 EPROM on reads while the EPROM is on (honors_phantom).
[[board]]
type           = "memory"
id             = "mem0"
fill           = "random"
honors_phantom = "read"
ext            = true
sixteen_bit    = true

  [[board.region]]
  type = "ram"
  at   = 0000
  size = "64K"
