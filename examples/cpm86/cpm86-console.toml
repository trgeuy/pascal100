# CompuPro CP/M-86 1.1 on the CPU 86/87, on the terminal where you start the program.
#
#     cd examples/cpm86 && pascal100 cpm86-console.toml
#     -> "Total Memory: 1 MEGABYTE", then the A> prompt.
#
# THIS FILE IS THE WHOLE MACHINE. It is the same machine and the same disk as cpm86.toml. Only
# the console is different: channel A of the Interfacer 1 stays on `console`, your stdio. Use
# this file on a build with no window.
#
# HOW IT BOOTS. The 8086 starts at FFFF0. While the Disk 1 boots, its boot ROM answers every
# memory read, so the 8086 runs the ROM's routine 0 (console on the Interfacer 1). The routine
# reads the boot tracks, and the loader on them loads CPM.SYS and starts CP/M-86. The disk is
# the CompuPro CP/M-86 1.1PAA master, disk 2 of 2, with R, W and HDIR added.

[machine]
name    = "cpm86-console"
# The bus is IEEE 696 (S-100): the 8086 uses A0-A19, the Disk 1 DMA A0-A23.
startup = ["RUN FFFF0"]   # the 8086 reset address; RUN 0 does not boot an 8086

# THE CPU 86/87: an 8086 on a 16-bit bus; no 8087 (docs/boards/compupro-cpu8687.md).
[[board]]
type = "cpu8687"
id   = "cpu"

# THE CONSOLE: channel A of an Interfacer 1 at 00-01, on your stdio. Channel B is not connected.
[[board]]
type = "interfacer1"
id   = "if1"

  [board.unit.a]
  connect = "console"

# THE DISK 1 at C0, boot routine 0: the 8086 routine with the console on the Interfacer 1.
[[board]]
type    = "disk1"
id      = "fd0"
port    = C0
routine = 0

  [[board.drive]]
  unit  = 0
  mount = "cpm86-11.dsk"

# THE SYSTEM SUPPORT 1 at 50-5F, for its clock (CLOCK.CMD; the time is the host's own). Its
# serial port is not connected: the console is on the Interfacer 1.
[[board]]
type = "ss1"
id   = "ss1"
base = 50

  [board.unit.serial]
  connect = "null"

# THE HOST BRIDGE at B0, for R, W and HDIR (R.CMD, W.CMD and HDIR.CMD on the disk). hostdir ""
# = the folder you started pascal100 in.
[[board]]
type    = "hostbridge"
id      = "hb0"
port    = B0
hostdir = ""

# 1 MB of RAM at 00000-FFFFF. `ext = true`: the board decodes A16-A23, as the 8088 needs.
[[board]]
type           = "memory"
id             = "mem0"
ext            = true
fill           = "zero"
honors_phantom = "read"

  [[board.region]]
  type = "ram"
  at   = 000000
  size = "1M"
