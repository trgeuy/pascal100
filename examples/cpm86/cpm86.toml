# CompuPro CP/M-86 1.1 on the CPU 8085/88, with its console in a built-in terminal WINDOW.
#
#     cd examples/cpm86 && pascal100 cpm86.toml
#     -> a terminal window opens; "Total Memory: 1 MEGABYTE" and the A> prompt appear IN IT.
#        The monitor's pascal100> prompt stays in the terminal you launched from.
#
# THIS FILE IS THE WHOLE MACHINE. It is the same machine and the same disk as
# cpm86-console.toml. Only the console is different: channel A of the Interfacer 1 connects to
# `terminal`, a window that the simulator draws. SDL only: a headless build refuses it, so use
# cpm86-console.toml there.
#> CompuPro CP/M-86 1.1, with its console in the window that just opened.
#> STOP (^E) pulls the keyboard back here to the monitor; RUN resumes the guest.
#
# HOW IT BOOTS. The Disk 1 boot ROM (routine 4, console on the Interfacer 1) runs on the 8085
# and reads the disk's boot sector. That code does IN FD: the CPU 8085/88 hands the bus to the
# 8088, which starts at FFFF0, loads CPM.SYS and starts CP/M-86. Only DRI and CompuPro files
# are on the disk (the CompuPro CP/M-86 1.1 master, disk 1 of 2).

[machine]
name    = "cpm86"
bus     = "ieee696"          # IEEE 696 (S-100): the 8088 uses A0-A19, the Disk 1 DMA A0-A23
startup = ["RUN 0"]

[display]
crt   = true
focus = true

# THE CPU 8085/88: an 8085 and an 8088 on one card; the 8085 starts (docs/boards/compupro-cpu8588.md).
[[board]]
type = "cpu8588"
id   = "cpu"

# THE CONSOLE: channel A of an Interfacer 1 at 00-01, in a window. Channel B is not connected.
[[board]]
type = "interfacer1"
id   = "if1"

  [board.unit.a]
  connect = "terminal?emulation=vt100&size=80x24&width=1100"
  title   = "CP/M-86 console"

# THE DISK 1 at C0, boot routine 4 (console on the Interfacer 1).
[[board]]
type    = "disk1"
id      = "fd0"
port    = C0
routine = 4

  [[board.drive]]
  unit  = 0
  mount = "cpm86-11.dsk"

# THE SYSTEM SUPPORT 1 at 50-5F, for its clock (CLOCK.CMD; the time is the host's own). Its
# serial port is not connected: the console is on the Interfacer 1.
[[board]]
type = "ss1"
id   = "ss1"
base = 50

  [board.unit.serial]
  connect = "null"

# THE HOST BRIDGE at B0, for R, W and HDIR (R.CMD, W.CMD and HDIR.CMD on the disk). hostdir ""
# = the folder you started pascal100 in.
[[board]]
type    = "hostbridge"
id      = "hb0"
port    = B0
hostdir = ""

# 1 MB of RAM at 00000-FFFFF. `ext = true`: the board decodes A16-A23, as the 8088 needs.
[[board]]
type           = "memory"
id             = "mem0"
ext            = true
fill           = "zero"
honors_phantom = "read"

  [[board.region]]
  type = "ram"
  at   = 000000
  size = "1M"
