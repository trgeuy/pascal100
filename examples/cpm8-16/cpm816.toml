# CompuPro CP/M 8-16 1.1PD from a Quantum Q540 hard disk on a CompuPro Disk 3, with its console in a built-in terminal WINDOW.
#
#     cd examples/cpm8-16 && pascal100 cpm816.toml
#     -> a terminal window opens; the CP/M 8-16 banner and the A> prompt appear IN IT.
#        The monitor's pascal100> prompt stays in the terminal you launched from.
#
# THIS FILE IS THE WHOLE MACHINE. It is the same machine and the same disks as
# cpm816-console.toml. Only the console is different: channel A of the Interfacer 1
# connects to `terminal`, a window that the simulator draws. SDL only: a headless build refuses
# it, so use cpm816-console.toml there.
#> CompuPro CP/M 8-16 1.1PD from the Disk 3, with its console in the window that just opened.
#> STOP (^E) pulls the keyboard back here to the monitor; RUN resumes the guest.
#
# HOW IT BOOTS. The Disk 1 boot ROM (routine 4) runs on the 8085 and reads the floppy's boot
# sector. That code does IN FD: the CPU 8085/88 hands the bus to the 8088, which loads CPM.SYS
# from the floppy. CPM.SYS is CompuPro's CPM340.SYS (V1.1PD, one Q540 on a Disk 3). Its BIOS
# resets the Disk 3, reads the label and the SPECIFY block from the hard disk, and makes the
# hard disk A: to E:. The floppy is F:.
[machine]
name    = "cpm816"
# The bus is IEEE 696 (S-100): the 8088 uses A0-A19, the Disk 1 and Disk 3 DMA A0-A23.
startup = ["RUN 0"]

[display]
crt   = true
focus = true

# THE CPU 8085/88: an 8085 and an 8088 on one card; the 8085 starts (docs/boards/compupro-cpu8588.md).
[[board]]
type = "cpu8588"
id   = "cpu"

# THE CONSOLE: channel A of an Interfacer 1 at 00-01, in a window. Channel B is not connected.
[[board]]
type = "interfacer1"
id   = "if1"

  # The loader waits until DSR or CTS reads 1 (OFF). `open` is a 3-wire cable: nothing drives
  # those inputs, and an open input reads OFF, as on the real board.
  [board.unit.a]
  rs232_inputs = "open"
  connect = "terminal?emulation=vt100&size=80x24&width=1100"
  title   = "CP/M 8-16 1.1PD console"

# THE DISK 1 at C0, boot routine 4 (console on the Interfacer 1). The boot floppy is drive F:.
[[board]]
type    = "disk1"
id      = "fd0"
port    = C0
routine = 4

  [[board.drive]]
  unit  = 0
  mount = "cpm816pd-boot.dsk"

# THE DISK 3 at 90 (docs/boards/compupro-disk3.md): CompuPro's port, DMA priority 9. The BIOS
# polls STATUS, so no interrupt is needed.
[[board]]
type = "disk3"
id   = "hd0"

  # A Quantum Q540 (the board's default shape: 512 cylinders, 8 heads, 9 x 1024). Formatted by
  # CompuPro's DISK3.CMD. A: to E: are its five partitions.
  [[board.drive]]
  unit  = 0
  mount = "q540.dsk"

# THE SYSTEM SUPPORT 1 at 50-5F, for its clock (CLOCK.CMD; the time is the host's own). Its
# serial port is not connected: the console is on the Interfacer 1.
[[board]]
type = "ss1"
id   = "ss1"
base = 50

  [board.unit.serial]
  connect = "null"

# THE HOST BRIDGE at B0, for R, W and HDIR (R.CMD, W.CMD and HDIR.CMD on both disks). hostdir ""
# = the folder you started pascal100 in.
[[board]]
type    = "hostbridge"
id      = "hb0"
port    = B0
hostdir = ""

# 1 MB of RAM at 00000-FFFFF. `ext = true`: the board decodes A16-A23, as the 8088 needs.
[[board]]
type           = "memory"
id             = "mem0"
ext            = true
fill           = "zero"
honors_phantom = "read"

  [[board.region]]
  type = "ram"
  at   = 000000
  size = "1M"
