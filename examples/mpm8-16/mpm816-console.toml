# CompuPro MP/M 8-16 2.1F from a Fujitsu M20 hard disk, on the terminal where you start the program.
#
#     cd examples/mpm8-16 && pascal100 mpm816-console.toml
#     -> "CompuPro MP/M 8-16" and the 0A> prompt (single-user: TTYS starts with SINGLE).
#
# TYPE SYNC BEFORE YOU STOP THE SIMULATOR. MP/M keeps a write cache for the hard disk and
# writes it every 30 seconds, on LOGOUT and on SYNC. Writes still in the cache are lost when
# you stop, as on the real machine when you switch it off.
#
# HOW IT BOOTS. The Disk 1 boot ROM (routine 6, console on the System Support 1) reads the boot
# floppy. Its loader is CompuPro's hard-disk loader: it reads MPM.SYS from the FLOPPY (so the
# floppy stays in drive 0) and starts MP/M, which then runs from the hard disk. The M20 is A:, B:
# and C:; the floppies are D: and E:.
#
# THIS FILE IS THE WHOLE MACHINE. It is mpm816.toml with the console on your stdio and tty1 and
# tty2 not connected. Use it on a build with no window.

[machine]
name    = "mpm816-console"
# The bus is IEEE 696 (S-100): A0-A23, TMA arbitration for the Disk 2.
startup = ["RUN 0"]

# THE CPU 8085/88: the 8085 boots; MP/M runs on the 8088 and SW! runs .COM files on the 8085.
[[board]]
type = "cpu8588"
id   = "cpu"

# An Interfacer 1 at 00-01, as in the machine this example was tested on. Nothing is connected.
[[board]]
type = "interfacer1"
id   = "if1"

  [board.unit.a]
  connect = "null"

# THE CONSOLE: the System Support 1's serial port at 5C-5F (board base 50).
[[board]]
type = "ss1"
id   = "ss1"
base = 50

  [board.unit.serial]
  connect = "console"

# THE DISK 1 at C0, boot routine 6 (console on the SS-1). Drive 0 holds the boot floppy.
[[board]]
type      = "disk1"
id        = "fd0"
port      = C0
routine   = 6
interrupt = "vi4"

  [[board.drive]]
  unit  = 0
  mount = "mpm816-boot.dsk"

# THE DISK 2 at C8, the hard disk controller. ATTN on VI1: MP/M's XIOS20 waits for it there.
[[board]]
type      = "disk2"
id        = "hd0"
interrupt = "vi1"

  [[board.drive]]
  unit  = 0
  mount = "m20.dsk"

# THE SELECTOR CHANNEL at F0: it runs the Disk 2's DMA cycles.
[[board]]
type = "selch"
id   = "sc0"

# THE HOST BRIDGE at B0, for R, W and HDIR (R.CMD, W.CMD and HDIR.CMD on the disk). hostdir ""
# = the folder you started pascal100 in.
[[board]]
type    = "hostbridge"
id      = "hb0"
port    = B0
hostdir = ""

# 1 MB of RAM at 00000-FFFFF.
[[board]]
type           = "memory"
id             = "mem0"
ext            = true
fill           = "zero"
honors_phantom = "read"

  [[board.region]]
  type = "ram"
  at   = 000000
  size = "1M"

# THE INTERFACER 4 at users 4-7: tty1, tty2 and the two printers (the MP/M 8-16 manual, p. 14).
# The disk's TTYS and LPRS files are written for this layout.
[[board]]
type  = "interfacer4"
id    = "if4"
users = "4-7"

  # Printer 0 (the default): the Centronics port. Output goes to a file beside this one.
  [board.unit.centronics]
  tx_int  = "vi3"
  connect = "out:printer0.txt"

  [board.unit.parallel]
  rx_int = "vi2"

  # Printer 1 (type PRINTER 1 to select it): serial port 5.
  [board.unit.user1]
  tx_int  = "vi3"
  rx_int  = "vi2"
  connect = "out:printer1.txt"

  [board.unit.user2]
  tx_int  = "vi3"
  rx_int  = "vi2"
  connect = "null"          # tty2: in a window in mpm816.toml

  [board.unit.user3]
  tx_int  = "vi3"
  rx_int  = "vi2"
  connect = "null"          # tty1: in a window in mpm816.toml
