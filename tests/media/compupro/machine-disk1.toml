# A basic CompuPro CP/M machine: a Z80, a Disk 1, an Interfacer 1 console and 64K. You supply the disk.
#
# A TEST FIXTURE. Until 2026-11-14 this was the built-in `disk1` machine; pascal100 now
# builds in only `default`. Tests load this file by path (or as a `base`).
#
# On the IEEE 696 bus. The Disk 1 is at C0 with its boot EPROM.
#
#     pascal100 tests/media/compupro/machine-disk1.toml
#     MOUNT fd0:drive0 "CPM22K-Working.dsk"
#     RUN 0
#     -> CompuPro Systems 64K CP/M 2.2K
#        A>
#
# THE DISK is the same CP/M 2.2K disk that the Pascal-100 boots for CP/M: the Pascal 100 how-to
# builds it (masters CPM22K-Working and CPM-Working-2, BIOS at F300, Interfacer 1). Both boot here
# (checked 2026-11-09: sign-on, DIR, STAT). CompuPro's own CP/M 2.2N disk boots too.
#
# THE DISK 1 at the CompuPro standard ports C0-C3. Its boot EPROM answers memory reads at
# 0000-00FF over PHANTOM* until the loader switches it off (OUT C3 with D0 = 0), so the
# machine boots from 0000. The EPROM is a factory dump. Routine 4, the default, is the 8080
# routine for an Interfacer console: it reads sectors 1-4 of track 0 on drive 0 into 0100 by
# DMA and falls into it with C = 0. Routine 6 passes C = 2, and the 2.2N BIOS then uses the
# System Support 1 serial channel as the console (`SET fd0 routine=6`, then
# `CONNECT ss1:serial console`).
#
# PORT 3 D7 is the board's serial line (S1-3, `port3 = serial`). Nothing is connected to it
# here. The 2.2N BIOS writes 80h to port C3 and leaves D7 = 1. D7 = 1 is SPACING, so the
# board logs one "break" line on each boot. The real board holds its line at SPACING in the
# same way.
#
# THE CONSOLE is channel A of an Interfacer 1 (`interfacer1`) at 00-01. The CP/M 2.2N BIOS writes
# the console to port 00. COMPUPRO.LIB on the 2.2N disk puts the Interfacer I UARTs at 00 and 02,
# with data on the even port and status on the odd port. Channel B at 02-03 is not connected.
#
# NO SYSTEM SUPPORT 1. ACTIVE.LIB on the 2.2N disk sets SYSUP1, but the BIOS boots and runs
# without the board (checked 2026-11-09: boot and DIR). The user's Pascal-100 box has none either.
# For routine 6 (the SS-1 serial console), add one: tests/media/compupro/cpm22n-ss1.toml.
#
# THE BUS is IEEE 696. Until 2026-11 this machine was on the Altair bus with a `gsio` console set
# to the Interfacer II profile and an SS-1.
#
# THE M-DRIVE/H is not emulated. The 2.2N BIOS finds 0 boards, and its cold-boot MFORM prints
# "DRIVE SPECIFIED IS NOT A MEMORY DRIVE". CP/M runs from the floppy.
#
# THE TERMINAL ignores bit 7. CompuPro's FORMAT.COM sets bit 7 of the last character of each
# message, and the terminals of the time printed the character without it. `strip7out` is the
# console doing what the terminal did.
#
# THE BACKSPACE KEY of a modern terminal sends DEL (7F). `bsdel = "bs"` folds DEL to BS, as the
# other built-in CP/M machines do.

[machine]
name    = "disk1"

[[board]]
type     = "z80"
id       = "cpu0"
clock_hz = 0

# The Interfacer 1: channel A (data 00, status 01) is the console, channel B (02-03) is not
# connected.
[[board]]
type = "interfacer1"
id   = "if1"

  [board.unit.a]
  connect = "console"

[console]
strip7out = true
bsdel     = "bs"

# The Disk 1 at its standard base of C0H, with boot routine 4 (the default).
[[board]]
type = "disk1"
id   = "fd0"
port = C0

# 64K of RAM. It decodes A0-A15 only (ext = false, the default), so it answers in every
# 64K segment. The boot EPROM shadows 0000-00FF on reads only (honors_phantom = read). The RAM
# under it still takes writes, and its bytes show once the EPROM is off.
[[board]]
type           = "memory"
id             = "mem0"
fill           = "random"
honors_phantom = "read"

  [[board.region]]
  type = "ram"
  at   = 0000
  size = "64K"
